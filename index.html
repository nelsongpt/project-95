<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project 95 OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
<header>
<div class="small">PROJECT 95 OS</div>
<h1>Good afternoon, Nelson</h1>
<p>One app. One plan. One direction.</p>
</header>

<div class="hero">
<div class="ring"><span>81kg</span></div>
<div>
<h2>Target 95kg</h2>
<div class="bar"><div class="fill" style="width:85%"></div></div>
<p>14kg to go</p>
</div>
</div>

<section class="grid">
<div class="card"><h3>🔥 Calories</h3><strong>0 / 3300</strong></div>
<div class="card"><h3>💪 Protein</h3><strong>0 / 180g</strong></div>
<div class="card"><h3>💰 Debt</h3><strong>$5,000</strong></div>
<div class="card"><h3>📖 Reading</h3><strong>0 / 20 pages</strong></div>
</section>

<section class="card">
<h2>Today's Mission</h2>
<label><input type="checkbox"> Work</label>
<label><input type="checkbox"> Gym</label>
<label><input type="checkbox"> Eat 3300 kcal</label>
<label><input type="checkbox"> Read 20 pages</label>
<label><input type="checkbox"> Sleep by 9pm</label>
</section>

<nav>
<button>🏠</button>
<button>🏋️</button>
<button>🍔</button>
<button>💰</button>
<button>📈</button>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
