<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Project 95</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Project 95</h1><p>Welcome, Nelson.</p></header>
<section class="card">
<h2>Goals</h2>
<ul>
<li>Weight: <strong>81 → 95 kg</strong></li>
<li>Debt: <strong>$5,000 → $0</strong></li>
<li>Read 20 pages today</li>
</ul>
</section>
<section class="card">
<h2>Today's Mission</h2>
<label><input type="checkbox"> Work</label>
<label><input type="checkbox"> Gym</label>
<label><input type="checkbox"> Eat 3300 kcal</label>
<label><input type="checkbox"> Read 20 pages</label>
<label><input type="checkbox"> Bed by 9:00 pm</label>
</section>
<section class="card">
<h2>Progress</h2>
<p>Weight</p>
<progress max="95" value="81"></progress>
<p>Debt paid</p>
<progress max="5000" value="0"></progress>
</section>
<script src="app.js"></script>
</body>
